<!DOCTYPE html>
<html>
<head>
    <title>Voice Image Viewer</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        input {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 5px;
        }

        #suggestions {
            margin-top: 10px;
        }

        .suggestion-item {
            cursor: pointer;
            padding: 5px;
        }

        .suggestion-item:hover {
            background-color: #eee;
        }

        img {
            margin-top: 20px;
            max-width: 400px;
        }

        #micStatus {
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

<h2>🎤 Voice Image Viewer</h2>

<input type="text" id="searchBox" placeholder="Enter code" oninput="liveSearch()" />

<button onclick="startContinuousListening()">▶ Start Listening</button>
<button onclick="stopListening()">⏹ Stop</button>

<p id="micStatus">Mic Off</p>

<div id="suggestions"></div>

<p id="status"></p>

<img id="image" />

<script>

let recognition;
let listening = false;

// 🧠 Memory
let lastResults = [];
let currentIndex = 0;

// 🖼 Show Image
function showImage(file) {
    document.getElementById("image").src = "/image/" + file;
    document.getElementById("status").innerText = "Showing: " + file;
}

// 🔊 Voice
function speak(text) {
    window.speechSynthesis.cancel(); // prevent overlap
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    window.speechSynthesis.speak(speech);
}

// 🧠 Extract code
function extractCode(text) {
    let cleaned = text.toUpperCase().replace(/ /g, "");
    let match = cleaned.match(/[A-Z0-9]{5,}/);
    return match ? match[0] : null;
}

// 🔍 Suggestions
function liveSearch() {
    let query = document.getElementById("searchBox").value;

    if (query.length < 2) {
        document.getElementById("suggestions").innerHTML = "";
        return;
    }

    fetch("/search?q=" + query)
    .then(res => res.json())
    .then(data => {
        let html = "";
        data.results.forEach(file => {
            html += `<div class="suggestion-item" onclick="selectFromList('${file}')">${file}</div>`;
        });
        document.getElementById("suggestions").innerHTML = html;
    });
}

// 📌 Select from suggestion
function selectFromList(file) {
    lastResults = [file];
    currentIndex = 0;
    showImage(file);
}

// 🎤 Start listening
function startContinuousListening() {
    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US";
    recognition.continuous = true;

    listening = true;
    recognition.start();

    document.getElementById("micStatus").innerText = "🎤 Listening...";
    speak("Voice assistant activated");

    recognition.onresult = function(event) {
        let text = event.results[event.results.length - 1][0].transcript;
        let command = text.toUpperCase();

        console.log("User:", command);

        // ❌ CLOSE
        if (command.includes("CLOSE")) {
            document.getElementById("image").src = "";
            speak("Image closed");
            return;
        }

        // ▶ NEXT
        if (command.includes("NEXT")) {
            if (lastResults.length > 0) {
                currentIndex = (currentIndex + 1) % lastResults.length;
                showImage(lastResults[currentIndex]);
                speak("Next item");
            }
            return;
        }

        // ⏮ PREVIOUS
        if (command.includes("PREVIOUS") || command.includes("BACK")) {
            if (lastResults.length > 0) {
                currentIndex = (currentIndex - 1 + lastResults.length) % lastResults.length;
                showImage(lastResults[currentIndex]);
                speak("Previous item");
            }
            return;
        }

        // 🔁 SIMILAR
        if (command.includes("SIMILAR") || command.includes("OPTIONS")) {
            if (lastResults.length > 1) {
                currentIndex = 1;
                showImage(lastResults[currentIndex]);
                speak("Showing similar items");
            } else {
                speak("No similar items found");
            }
            return;
        }

        // 🧠 Extract code
        let code = extractCode(command);

        if (!code) {
            speak("I did not understand");
            return;
        }

        document.getElementById("searchBox").value = code;

        fetch("/search?q=" + code)
        .then(res => res.json())
        .then(data => {
            if (data.results.length > 0) {
                lastResults = data.results;
                currentIndex = 0;

                showImage(lastResults[0]);

                if (lastResults.length > 1) {
                    speak("Showing best match. You can say next or similar");
                } else {
                    speak("Opening " + code);
                }
            } else {
                speak("No product found");
            }
        });
    };

    recognition.onerror = function() {
        if (listening) recognition.start();
    };

    recognition.onend = function() {
        if (listening) recognition.start();
    };
}

// ⏹ Stop
function stopListening() {
    listening = false;
    recognition.stop();
    document.getElementById("micStatus").innerText = "Mic Off";
    speak("Assistant stopped");
}

</script>

</body>
</html>

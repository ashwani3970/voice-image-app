<!DOCTYPE html>
<html>
<head>
    <title>Product Voice Viewer</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial;
            background: #f4f6f9;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo {
            height: 50px;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            width: 80%;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button {
            padding: 10px 15px;
            font-size: 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-start {
            background: #28a745;
            color: white;
        }

        .btn-stop {
            background: #dc3545;
            color: white;
        }

        #micStatus {
            margin-top: 10px;
            font-weight: bold;
        }

        .image-box {
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            background: #fafafa;
            border: 1px solid #eee;
        }

        img {
            max-width: 100%;
            border-radius: 8px;
        }

        #loaderScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            border: 5px solid #eee;
            border-top: 5px solid #333;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-top: 10px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<!-- Loader -->
<div id="loaderScreen">
    <h2 id="appName">🚀 Product Voice Viewer</h2>
    <p id="loadingText">Starting system...</p>
    <div class="spinner"></div>
</div>

<div class="container">

    <!-- 🔷 BRANDING -->
    <img src="/static/logo.png" class="logo" alt="Logo">

    <h2 id="appTitle">Product Voice Viewer</h2>

    <input type="text" id="searchBox" placeholder="Enter or speak product code..." />

    <br>

    <button class="btn-start" onclick="startListening()">▶ Start</button>
    <button class="btn-stop" onclick="stopListening()">⏹ Stop</button>

    <p id="micStatus">Mic Off</p>

    <p id="status"></p>

    <div class="image-box">
        <img id="image" />
    </div>

</div>

<script>

// 🔧 CONFIG (Change this anytime)
const APP_NAME = "My Retail Assistant"; // 🔥 change name here

document.getElementById("appTitle").innerText = APP_NAME;
document.getElementById("appName").innerText = "🚀 " + APP_NAME;

// 🎤
let recognition;
let listening = false;

// 🔊 voice
function speak(text) {
    window.speechSynthesis.cancel();
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    window.speechSynthesis.speak(speech);
}

// 🧠 extract code
function extractCode(text) {
    let cleaned = text.toUpperCase().replace(/ /g, "");
    let match = cleaned.match(/[A-Z0-9]{5,}/);
    return match ? match[0] : null;
}

// 🖼 show image
function showImage(file) {
    document.getElementById("image").src = "/image/" + file;
    document.getElementById("status").innerText = "Showing: " + file;
}

// 🎤 start
function startListening() {
    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = true;

    listening = true;
    recognition.start();

    document.getElementById("micStatus").innerText = "🎤 Listening...";
    speak("Assistant ready");

    recognition.onresult = function(event) {
        let text = event.results[event.results.length - 1][0].transcript;
        let command = text.toUpperCase();

        if (command.includes("CLOSE")) {
            document.getElementById("image").src = "";
            speak("Closed");
            return;
        }

        let code = extractCode(command);

        if (!code) {
            speak("Please say the product code clearly");
            return;
        }

        document.getElementById("searchBox").value = code;

        fetch("/search?q=" + code)
        .then(res => res.json())
        .then(data => {
            if (data.results.length > 0) {
                showImage(data.results[0]);
                speak("Opening " + code);
            } else {
                speak("Product not found");
            }
        });
    };

    recognition.onend = () => { if (listening) recognition.start(); };
}

// ⏹ stop
function stopListening() {
    listening = false;
    recognition.stop();
    document.getElementById("micStatus").innerText = "Mic Off";
    speak("Stopped");
}

// 🚀 loader
function waitForAppReady() {
    fetch("/search?q=test")
    .then(() => {
        document.getElementById("loaderScreen").style.display = "none";
        speak("System ready");
    })
    .catch(() => {
        setTimeout(waitForAppReady, 1000);
    });
}

// dynamic loading text
let msgs = ["Initializing system...", "Loading data...", "Almost ready..."];
let i = 0;
setInterval(() => {
    document.getElementById("loadingText").innerText = msgs[i % msgs.length];
    i++;
}, 1500);

window.onload = waitForAppReady;

</script>

</body>
</html>

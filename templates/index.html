<!DOCTYPE html>
<html>
<head>
    <title>Voice Image Viewer Pro</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial;
            background: #f4f6f9;
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            width: 70%;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button {
            padding: 10px 15px;
            font-size: 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-start {
            background: #28a745;
            color: white;
        }

        .btn-stop {
            background: #dc3545;
            color: white;
        }

        #micStatus {
            margin-top: 10px;
            font-weight: bold;
        }

        #suggestions {
            margin-top: 10px;
            text-align: left;
        }

        .suggestion-item {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .suggestion-item:hover {
            background: #f1f1f1;
        }

        .image-box {
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            background: #fafafa;
            border: 1px solid #eee;
        }

        img {
            max-width: 100%;
            border-radius: 8px;
        }

        #loaderScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            border: 5px solid #eee;
            border-top: 5px solid #333;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-top: 10px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<!-- Loader -->
<div id="loaderScreen">
    <h2>🚀 Voice Image Viewer</h2>
    <p id="loadingText">Initializing...</p>
    <div class="spinner"></div>
</div>

<div class="container">

    <h2>🎤 Voice Image Viewer</h2>

    <input type="text" id="searchBox" placeholder="Enter or speak product code..." oninput="liveSearch()" />

    <br>

    <button class="btn-start" onclick="startContinuousListening()">▶ Start</button>
    <button class="btn-stop" onclick="stopListening()">⏹ Stop</button>

    <p id="micStatus">Mic Off</p>

    <div id="suggestions"></div>

    <p id="status"></p>

    <div class="image-box">
        <img id="image" />
    </div>

</div>

<script>

let recognition;
let listening = false;

let lastResults = [];
let currentIndex = 0;

function showImage(file) {
    document.getElementById("image").src = "/image/" + file;
    document.getElementById("status").innerText = "Showing: " + file;
}

function speak(text) {
    window.speechSynthesis.cancel();
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    window.speechSynthesis.speak(speech);
}

function extractCode(text) {
    let cleaned = text.toUpperCase().replace(/ /g, "");
    let match = cleaned.match(/[A-Z0-9]{5,}/);
    return match ? match[0] : null;
}

function liveSearch() {
    let query = document.getElementById("searchBox").value;

    if (query.length < 2) {
        document.getElementById("suggestions").innerHTML = "";
        return;
    }

    fetch("/search?q=" + query)
    .then(res => res.json())
    .then(data => {
        let html = "";
        data.results.forEach(file => {
            html += `<div class="suggestion-item" onclick="selectFromList('${file}')">${file}</div>`;
        });
        document.getElementById("suggestions").innerHTML = html;
    });
}

function selectFromList(file) {
    lastResults = [file];
    currentIndex = 0;
    showImage(file);
}

function startContinuousListening() {
    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = true;

    listening = true;
    recognition.start();

    document.getElementById("micStatus").innerText = "🎤 Listening...";
    speak("Assistant activated");

    recognition.onresult = function(event) {
        let text = event.results[event.results.length - 1][0].transcript;
        let command = text.toUpperCase();

        if (command.includes("CLOSE")) {
            document.getElementById("image").src = "";
            speak("Closed");
            return;
        }

        if (command.includes("NEXT")) {
            if (lastResults.length > 0) {
                currentIndex = (currentIndex + 1) % lastResults.length;
                showImage(lastResults[currentIndex]);
                speak("Next item");
            }
            return;
        }

        if (command.includes("PREVIOUS")) {
            if (lastResults.length > 0) {
                currentIndex = (currentIndex - 1 + lastResults.length) % lastResults.length;
                showImage(lastResults[currentIndex]);
                speak("Previous item");
            }
            return;
        }

        let code = extractCode(command);
        if (!code) return;

        document.getElementById("searchBox").value = code;

        fetch("/search?q=" + code)
        .then(res => res.json())
        .then(data => {
            if (data.results.length > 0) {
                lastResults = data.results;
                currentIndex = 0;
                showImage(lastResults[0]);
                speak("Showing result");
            } else {
                speak("Not found");
            }
        });
    };

    recognition.onend = () => { if (listening) recognition.start(); };
}

function stopListening() {
    listening = false;
    recognition.stop();
    document.getElementById("micStatus").innerText = "Mic Off";
    speak("Stopped");
}

function waitForAppReady() {
    fetch("/search?q=test")
    .then(() => {
        document.getElementById("loaderScreen").style.display = "none";
        speak("System ready");
    })
    .catch(() => {
        setTimeout(waitForAppReady, 1000);
    });
}

let messages = ["Loading engine...", "Preparing data...", "Almost ready..."];
let i = 0;
setInterval(() => {
    document.getElementById("loadingText").innerText = messages[i % messages.length];
    i++;
}, 1500);

window.onload = waitForAppReady;

</script>

</body>
</html>

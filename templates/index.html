<!DOCTYPE html>
<html>
<head>
    <title>Voice Image Viewer</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        input {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 5px;
        }

        #suggestions {
            margin-top: 10px;
        }

        .suggestion-item {
            cursor: pointer;
            padding: 5px;
        }

        .suggestion-item:hover {
            background-color: #eee;
        }

        img {
            margin-top: 20px;
            max-width: 400px;
        }

        #micStatus {
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

<h2>🎤 Voice Image Viewer</h2>

<input type="text" id="searchBox" placeholder="Enter code" oninput="liveSearch()" />

<button onclick="startContinuousListening()">▶ Start Listening</button>
<button onclick="stopListening()">⏹ Stop</button>

<p id="micStatus">Mic Off</p>

<div id="suggestions"></div>

<p id="status"></p>

<img id="image" />

<script>

let recognition;
let listening = false;

// 🖼 Show Image
function showImage(file) {
    document.getElementById("image").src = "/image/" + file;
    document.getElementById("status").innerText = "Showing: " + file;
}

// 🔊 Voice response
function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    speech.rate = 1;
    window.speechSynthesis.speak(speech);
}

// 🧠 Extract product code intelligently
function extractCode(text) {
    let cleaned = text.toUpperCase().replace(/ /g, "");
    let match = cleaned.match(/[A-Z0-9]{5,}/);
    return match ? match[0] : null;
}

// 🔍 Suggestions
function liveSearch() {
    let query = document.getElementById("searchBox").value;

    if (query.length < 2) {
        document.getElementById("suggestions").innerHTML = "";
        return;
    }

    fetch("/search?q=" + query)
    .then(res => res.json())
    .then(data => {
        let html = "";
        data.results.forEach(file => {
            html += `<div class="suggestion-item" onclick="showImage('${file}')">${file}</div>`;
        });
        document.getElementById("suggestions").innerHTML = html;
    });
}

// 🎤 Start continuous listening (AI upgraded)
function startContinuousListening() {
    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US";
    recognition.continuous = true;
    recognition.interimResults = false;

    listening = true;
    recognition.start();

    document.getElementById("micStatus").innerText = "🎤 Listening...";
    speak("Voice assistant activated");

    recognition.onresult = function(event) {
        let text = event.results[event.results.length - 1][0].transcript;
        console.log("User said:", text);

        let command = text.toUpperCase();

        // ❌ CLOSE
        if (command.includes("CLOSE")) {
            document.getElementById("image").src = "";
            document.getElementById("status").innerText = "❌ Closed";
            speak("Image closed");
            return;
        }

        // 🧠 Extract code automatically (no strict SHOW needed)
        let code = extractCode(command);

        if (!code) {
            speak("I did not understand the product code");
            return;
        }

        document.getElementById("searchBox").value = code;

        fetch("/search?q=" + code)
        .then(res => res.json())
        .then(data => {
            if (data.results.length > 0) {
                showImage(data.results[0]);

                if (data.results.length > 1) {
                    speak("Showing best match. I also found similar items.");
                } else {
                    speak("Opening " + code);
                }
            } else {
                document.getElementById("status").innerText = "❌ Not found";
                speak("No product found");
            }
        });
    };

    recognition.onerror = function() {
        if (listening) recognition.start();
    };

    recognition.onend = function() {
        if (listening) recognition.start();
    };
}

// ⏹ Stop
function stopListening() {
    listening = false;
    recognition.stop();
    document.getElementById("micStatus").innerText = "Mic Off";
    speak("Voice assistant stopped");
}

</script>

</body>
</html>

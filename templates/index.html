<!DOCTYPE html>
<html>
<head>
    <title>Voice Image Viewer</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        input {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 5px;
        }

        #suggestions {
            margin-top: 10px;
        }

        .suggestion-item {
            cursor: pointer;
            padding: 5px;
        }

        .suggestion-item:hover {
            background-color: #eee;
        }

        img {
            margin-top: 20px;
            max-width: 400px;
        }

        #micStatus {
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

<h2>🎤 Voice Image Viewer</h2>

<input type="text" id="searchBox" placeholder="Enter code" oninput="liveSearch()" />

<button onclick="startContinuousListening()">▶ Start Listening</button>
<button onclick="stopListening()">⏹ Stop</button>

<p id="micStatus">Mic Off</p>

<div id="suggestions"></div>

<p id="status"></p>

<img id="image" />

<script>

let recognition;
let listening = false;

function showImage(file) {
    document.getElementById("image").src = "/image/" + file;
    document.getElementById("status").innerText = "Showing: " + file;
}

// 🔍 Suggestions
function liveSearch() {
    let query = document.getElementById("searchBox").value;

    if (query.length < 2) {
        document.getElementById("suggestions").innerHTML = "";
        return;
    }

    fetch("/search?q=" + query)
    .then(res => res.json())
    .then(data => {
        let html = "";
        data.results.forEach(file => {
            html += `<div class="suggestion-item" onclick="showImage('${file}')">${file}</div>`;
        });
        document.getElementById("suggestions").innerHTML = html;
    });
}

// 🎤 Start continuous listening
function startContinuousListening() {
    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US";
    recognition.continuous = true;
    recognition.interimResults = false;

    listening = true;
    recognition.start();

    document.getElementById("micStatus").innerText = "🎤 Listening...";

    recognition.onresult = function(event) {
        let text = event.results[event.results.length - 1][0].transcript;
        let command = text.toUpperCase().replace(/ /g, "");

        console.log("Heard:", command);

        // CLOSE
        if (command.includes("CLOSE")) {
            document.getElementById("image").src = "";
            document.getElementById("status").innerText = "❌ Closed";
            return;
        }

        // WAKE WORD: SHOW
        if (!command.includes("SHOW")) {
            return; // ignore random speech
        }

        command = command.replace("SHOW", "");

        document.getElementById("searchBox").value = command;

        fetch("/search?q=" + command)
        .then(res => res.json())
        .then(data => {
            if (data.results.length > 0) {
                showImage(data.results[0]);
            } else {
                document.getElementById("status").innerText = "❌ Not found";
            }
        });
    };

    recognition.onerror = function() {
        if (listening) {
            recognition.start(); // auto-restart
        }
    };

    recognition.onend = function() {
        if (listening) {
            recognition.start(); // keep alive
        }
    };
}

// ⏹ Stop
function stopListening() {
    listening = false;
    recognition.stop();
    document.getElementById("micStatus").innerText = "Mic Off";
}

</script>

</body>
</html>
